# Profile {@code test} — banco dedicado pra ITs (fix code review Sprint 8 Task 8.8).
# Aponta pra base {@code sep_test} por default; CI pode sobrescrever via env DB_NAME.
#
# Setup local: o IT exige que o banco exista previamente:
#   createdb -h localhost -U sep sep_test
#
# Flyway corre as mesmas migrations em sep_test no boot da JVM de teste.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sep_test}
    username: ${DB_USER:sep}
    password: ${DB_PASSWORD:sep}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 15000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: never

app:
  # Sprint 12: ITs deste perfil nao validam fluxo cobranca, entao listener
  # ContratoAssinadoEvent->agenda fica desligado pra evitar FK leak no teardown
  # de ContratoIT/AssinaturaIT/CreditoIT/OpenFinanceIT. CobrancaIT (Task 12.8)
  # reabilita explicitamente via @TestPropertySource.
  cobranca:
    auto-geracao-pos-assinatura: false
    # Job de atraso (Sprint 12 Task 12.5) tambem desligado pra evitar disparo
    # de evento em janela aleatoria de IT. MarcarParcelaAtrasadaJobTest mocka
    # Clock e chama o metodo direto.
    scheduling-habilitado: false
    # Sprint 13: Seeder do workflow_cobranca (Task 13.4 fix manual) desligado em
    # test pra @DataJpaTest do WorkflowCobrancaRepository nao colidir com rows
    # persistentes deixadas por @SpringBootTest anterior. CobrancaIT reativa via
    # @TestPropertySource se precisar do seed.
    workflow-seed-habilitado: false
  # Sprint 13: forca LogNotificationProvider em todos os ITs/UTs do perfil test.
  # Adapter SMTP/Zenvia exige credencial real — Log evita chamada externa e
  # mantem rastreio via metadados. Precedence Spring: @TestPropertySource >
  # application-test.yml > application.yml, entao ITs que precisem testar
  # adapter real podem sobrescrever via @TestPropertySource("app.notificacoes.provider=smtp-zenvia").
  notificacoes:
    provider: log
