spring:
  application:
    name: sep-api

  jpa:
    hibernate:
      ddl-auto: validate # Flyway gerencia o schema; Hibernate apenas valida
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: false

  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-with-zone-id: true
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      # Documentos KYC tem limite de 10MB por regra de dominio
      # (EnviarDocumentoUseCase). Permite 12MB no transporte para que o use case
      # rejeite com 400 (ONB-400-004) em vez do parser multipart estourar 413/500.
      max-file-size: 12MB
      max-request-size: 12MB

  mvc:
    throw-exception-if-no-handler-found: true
    # spring.web.resources.add-mappings fica DEFAULT (true) para servir webjars
    # do Swagger UI; paths inexistentes geram NoResourceFoundException, mapeada
    # para 404 em ApiExceptionHandler.

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never # nao expor detalhes em prod; dev sobrescreve
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080
  # Sprint 35 Task 35.2: 'native' em vez de 'framework' PORQUE so o RemoteIpValve do Tomcat tem
  # allowlist de proxy. Com 'framework' o ForwardedHeaderFilter do Spring honra X-Forwarded-For de
  # QUALQUER origem, e a origem que alimenta o rate limit por IP e a trilha de login passa a ser
  # escolhida pelo cliente. As duas linhas andam juntas: 'internal-proxies' e propriedade do
  # RemoteIpValve e so tem efeito com 'native'; trocar so a estrategia pioraria.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Default: NAO confia em ninguem (vazio -> RemoteIpValve nunca processa o header). O CIDR do
      # balanceador nao existe ate a Fase 5, e um default permissivo aqui reabre exatamente o
      # bypass que esta Task fecha. Um valor largo demais mantem o bypass; estreito demais faz todo
      # mundo compartilhar o IP do balanceador e o limite vira global — por isso e env var, nao
      # constante. Regex Java, nao CIDR: ex. APP_TRUSTED_PROXIES='10\.0\.\d+\.\d+'.
      internal-proxies: ${APP_TRUSTED_PROXIES:}

# Propriedades de aplicacao (placeholders; valores reais via env vars)
app:
  observability:
    environment: ${APP_ENVIRONMENT:local}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
  jwt:
    secret: ${APP_JWT_SECRET:placeholder-dev-only-min-256-bits-key-replace-in-prod-please}
    # access-expiration-seconds substitui expiration-seconds (Sprint 5 Task 5.3 — access curto + refresh longo)
    access-expiration-seconds: ${APP_JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${APP_JWT_REFRESH_EXPIRATION:2592000}
    # Compatibilidade: nome antigo mantido como fallback do access-expiration
    expiration-seconds: ${APP_JWT_EXPIRATION:900}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200,http://localhost:8100}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,X-Step-Up-Token,X-Client-Channel
    # Retry-After nao e CORS-safelisted: sem estar aqui, o 423 e o 429 chegam ao browser com o
    # header cortado e `headers.get('Retry-After')` devolve null no sep-app/sep-mobile, que sao
    # origens distintas da API (Sprint 34 Task 34.3).
    exposed-headers: X-Correlation-Id,Retry-After
    allow-credentials: true
    max-age: 3600
  # Cookie HttpOnly de refresh token para canal WEB (5F-FIX-02). Em producao, secure=true e
  # same-site=Strict; em dev-local mantemos Lax + secure=false para http://localhost.
  refresh-cookie:
    name: ${APP_REFRESH_COOKIE_NAME:sep-refresh}
    path: ${APP_REFRESH_COOKIE_PATH:/api/v1/auth}
    secure: ${APP_REFRESH_COOKIE_SECURE:false}
    same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
    domain: ${APP_REFRESH_COOKIE_DOMAIN:}
  integration:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  webhooks:
    secrets:
      celcoin: ${APP_WEBHOOK_SECRET_CELCOIN:dev-webhook-secret-change-me}
      celcoin-kyc: ${APP_WEBHOOK_SECRET_CELCOIN_KYC:dev-kyc-webhook-secret-change-me}
      celcoin-kyb: ${APP_WEBHOOK_SECRET_CELCOIN_KYB:dev-kyb-webhook-secret-change-me}
      celcoin-pld: ${APP_WEBHOOK_SECRET_CELCOIN_PLD:dev-pld-webhook-secret-change-me}
      celcoin-open-finance: ${APP_WEBHOOK_SECRET_CELCOIN_OPEN_FINANCE:dev-open-finance-webhook-secret-change-me}
      celcoin-pix: ${APP_WEBHOOK_SECRET_CELCOIN_PIX:dev-pix-webhook-secret-change-me}
      # clicksign-assinatura reusa APP_WEBHOOK_SECRET_CLICKSIGN (mesma env var de
      # app.assinatura.clicksign.webhook.hmac-secret abaixo); HmacSignatureValidator generico
      # exige entrada propria em app.webhooks.secrets.<provider>, daí a duplicacao no YAML.
      clicksign-assinatura: ${APP_WEBHOOK_SECRET_CLICKSIGN:dev-clicksign-webhook-secret-change-me}
  kyc:
    provider: ${APP_KYC_PROVIDER:fake}
  kyb:
    provider: ${APP_KYB_PROVIDER:fake}
  pld:
    provider: ${APP_PLD_PROVIDER:fake}
  open-finance:
    provider: ${APP_OPEN_FINANCE_PROVIDER:fake}
  pix:
    provider: ${APP_PIX_PROVIDER:fake}
  escrow:
    provider: ${APP_ESCROW_PROVIDER:fake}
  assinatura:
    provider: ${APP_ASSINATURA_PROVIDER:fake}
    # Quando true (default), ContratoAceitoListener dispara EnviarParaAssinatura
    # apos cada aceite (AFTER_COMMIT + REQUIRES_NEW). Desligado em ITs do modulo
    # contratos para preservar testes de aceite isolados; reativar em prod.
    auto-envio-pos-aceite: ${APP_ASSINATURA_AUTO_ENVIO_POS_ACEITE:true}
    clicksign:
      base-url: ${APP_CLICKSIGN_BASE_URL:https://sandbox.clicksign.com}
      # Default vazio (nao "#{null}", que SpringBoot binda como texto literal em
      # @ConfigurationProperties). Construtor do ClicksignAssinaturaDigitalProvider
      # valida isBlank() e lanca IllegalStateException quando provider=clicksign
      # sem APP_CLICKSIGN_ACCESS_TOKEN — previne `Bearer ` invalido em prod.
      # Fake nao usa, entao manter blank em dev/test e ok.
      access-token: ${APP_CLICKSIGN_ACCESS_TOKEN:}
      webhook:
        hmac-secret: ${APP_WEBHOOK_SECRET_CLICKSIGN:dev-clicksign-webhook-secret-change-me}
  backoffice:
    # Dashboard de visao consolidada (Sprint 14 Task 14.5). timezone define o recorte
    # do "dia operacional" usado pra somar recebimentos; demais campos sao thresholds
    # operacionais (janela do tempo medio de resolucao, antiguidade pra item critico,
    # limite do top tipos).
    dashboard:
      timezone: ${APP_BACKOFFICE_DASHBOARD_TIMEZONE:America/Sao_Paulo}
      tempo-medio-janela-dias: ${APP_BACKOFFICE_DASHBOARD_TEMPO_MEDIO_JANELA_DIAS:30}
      criticos-threshold-horas: ${APP_BACKOFFICE_DASHBOARD_CRITICOS_THRESHOLD_HORAS:48}
      top-tipos-limit: ${APP_BACKOFFICE_DASHBOARD_TOP_TIPOS_LIMIT:5}
    # Job consolidador da fila operacional (Sprint 14 Task 14.2). Varre tres fontes
    # de pendencia baseadas em tempo (proposta parada, contrato sem assinatura, webhook
    # falhou/pendente antigo) e cria itens via CriarItemFilaOperacionalService.
    verificador:
      cron: ${APP_BACKOFFICE_VERIFICADOR_CRON:0 */15 * * * *}
      proposta-pendencia-horas: ${APP_BACKOFFICE_PROPOSTA_PENDENCIA_HORAS:24}
      contrato-aceito-horas: ${APP_BACKOFFICE_CONTRATO_ACEITO_HORAS:48}
      webhook-falhou-horas: ${APP_BACKOFFICE_WEBHOOK_FALHOU_HORAS:1}
  cobranca:
    # Email do time financeiro pra copia de comunicacao final de inadimplencia
    # (Sprint 13 Task 13.5 — fix review manual). Vazio = nao envia copia.
    financeiro-email: ${APP_COBRANCA_FINANCEIRO_EMAIL:}
    # Workflow default de cobranca (Sprint 13 Task 13.4). Etapas por dia de atraso —
    # `EscalarCobrancaUseCase` casa o numero de dias e dispara as notificacoes correspondentes.
    # Flags operacionais: `flag-contato-manual` sinaliza para o backoffice; `escalonar-backoffice`
    # publica evento pra fila operacional; `marcar-inadimplente` informa que o `MarcarParcelaInadimplenteJob`
    # (Task 13.5) eh quem efetiva a transicao 90+ dias.
    workflow:
      dias-atraso:
        - dia: 0
          notificacoes: [email-amigavel]
        - dia: 5
          notificacoes: [email-amigavel, sms-lembrete]
        - dia: 15
          notificacoes: [email-firme, sms-firme]
        - dia: 30
          notificacoes: [email-firme, sms-firme]
          flag-contato-manual: true
        - dia: 60
          notificacoes: [email-final]
          escalonar-backoffice: true
        - dia: 90
          notificacoes: [email-final, sms-firme]
          marcar-inadimplente: true
  notificacoes:
    # Provider de envio (Sprint 13 - ADR 0014). `log` registra metadados sem enviar
    # nada externo e eh default seguro. `smtp-zenvia` ativa email SMTP + SMS Zenvia.
    provider: ${APP_NOTIFICACOES_PROVIDER:log}
    # Default `no-reply@sep.local` eh sentinela nao-roteavel pra evitar envio
    # acidental em dev/test caso provider=smtp-zenvia vaze sem APP_NOTIFICACOES_*
    # configurado. Prod sobrescreve via APP_NOTIFICACOES_REMETENTE_EMAIL.
    remetente-email: ${APP_NOTIFICACOES_REMETENTE_EMAIL:no-reply@sep.local}
    # Env vars seguem prefixo APP_NOTIFICACOES_ZENVIA_* (alinhado a APP_CELCOIN_*
    # e APP_CLICKSIGN_*) — uniformiza precedence parsing entre adapters.
    zenvia:
      base-url: ${APP_NOTIFICACOES_ZENVIA_BASE_URL:https://api.zenvia.com}
      # Token vazio por default — adapter valida isBlank() ao bootar com
      # provider=smtp-zenvia e falha rapido em prod sem credencial.
      api-token: ${APP_NOTIFICACOES_ZENVIA_API_TOKEN:}
      from: ${APP_NOTIFICACOES_ZENVIA_FROM:SEP}
      timeout-ms: ${APP_NOTIFICACOES_ZENVIA_TIMEOUT_MS:5000}
  celcoin:
    kyc:
      base-url: ${APP_CELCOIN_KYC_BASE_URL:https://sandbox.openfinance.celcoin.dev/onboarding/v1}
      client-id: ${APP_CELCOIN_KYC_CLIENT_ID:}
      client-secret: ${APP_CELCOIN_KYC_CLIENT_SECRET:}
    kyb:
      base-url: ${APP_CELCOIN_KYB_BASE_URL:https://sandbox.openfinance.celcoin.dev/onboarding/v1}
      client-id: ${APP_CELCOIN_KYB_CLIENT_ID:${APP_CELCOIN_KYC_CLIENT_ID:}}
      client-secret: ${APP_CELCOIN_KYB_CLIENT_SECRET:${APP_CELCOIN_KYC_CLIENT_SECRET:}}
    background-check:
      base-url: ${APP_CELCOIN_BACKGROUND_CHECK_BASE_URL:https://sandbox.openfinance.celcoin.dev/onboarding/v1}
      client-id: ${APP_CELCOIN_BACKGROUND_CHECK_CLIENT_ID:${APP_CELCOIN_KYC_CLIENT_ID:}}
      client-secret: ${APP_CELCOIN_BACKGROUND_CHECK_CLIENT_SECRET:${APP_CELCOIN_KYC_CLIENT_SECRET:}}
    open-finance:
      base-url: ${APP_CELCOIN_OPEN_FINANCE_BASE_URL:https://sandbox.openfinance.celcoin.dev/open-finance/v1}
      client-id: ${APP_CELCOIN_OPEN_FINANCE_CLIENT_ID:}
      client-secret: ${APP_CELCOIN_OPEN_FINANCE_CLIENT_SECRET:}
    pix:
      base-url: ${APP_CELCOIN_PIX_BASE_URL:https://sandbox.openfinance.celcoin.dev/pix/v1}
      client-id: ${APP_CELCOIN_PIX_CLIENT_ID:}
      client-secret: ${APP_CELCOIN_PIX_CLIENT_SECRET:}
    escrow:
      base-url: ${APP_CELCOIN_ESCROW_BASE_URL:https://sandbox.openfinance.celcoin.dev/escrow/v1}
      client-id: ${APP_CELCOIN_ESCROW_CLIENT_ID:}
      client-secret: ${APP_CELCOIN_ESCROW_CLIENT_SECRET:}
  credito:
    motor:
      score-inicial: ${APP_CREDITO_SCORE_INICIAL:1000}
      penalidade-falha: ${APP_CREDITO_PENALIDADE_FALHA:50}
      penalidade-pendencia: ${APP_CREDITO_PENALIDADE_PENDENCIA:20}
      score-pre-aprovacao: ${APP_CREDITO_SCORE_PRE_APROVACAO:700}
      score-analise: ${APP_CREDITO_SCORE_ANALISE:400}
      idade-minima-pessoa: ${APP_CREDITO_IDADE_MINIMA_PESSOA:18}
      tempo-minimo-empresa-meses: ${APP_CREDITO_TEMPO_MINIMO_EMPRESA_MESES:6}
      valor-maximo-pf: ${APP_CREDITO_VALOR_MAXIMO_PF:50000.00}
      valor-maximo-pj: ${APP_CREDITO_VALOR_MAXIMO_PJ:200000.00}
      prazo-maximo-pf-meses: ${APP_CREDITO_PRAZO_MAXIMO_PF_MESES:12}
      prazo-maximo-pj-meses: ${APP_CREDITO_PRAZO_MAXIMO_PJ_MESES:24}
  security:
    totp:
      issuer: ${APP_TOTP_ISSUER:SEP}
      window-size: ${APP_TOTP_WINDOW_SIZE:1}
      encryption-key: ${APP_TOTP_ENCRYPTION_KEY:dev-totp-encryption-key-min-32-bytes-please-change}
    # INVARIANTE: os limites por IP devem ser estritamente MAIORES que lockout.max-attempts.
    # O RateLimitFilter roda antes do controller; se os dois valessem 5, a 6a tentativa — a unica
    # capaz de responder 423 — seria barrada com 429 e o usuario legitimo nunca saberia que a conta
    # esta bloqueada. Quem protege a conta e o lockout; o rate limit protege o servico.
    rate-limit:
      login-per-minute-per-ip: ${APP_RATE_LIMIT_LOGIN:10}
      totp-verify-per-minute-per-ip: ${APP_RATE_LIMIT_TOTP_VERIFY:10}
    lockout:
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:5}
      window-minutes: ${APP_LOCKOUT_WINDOW_MINUTES:15}
      lockout-minutes: ${APP_LOCKOUT_LOCKOUT_MINUTES:30}

# Defaults Resilience4j (overrides por instance vem nas Sprints 6+)
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      celcoin-kyc:
        baseConfig: default
      celcoin-kyb:
        baseConfig: default
      celcoin-background-check:
        baseConfig: default
      celcoin-open-finance:
        baseConfig: default
      celcoin-pix:
        baseConfig: default
      celcoin-escrow:
        baseConfig: default
      clicksign-assinatura:
        baseConfig: default
      zenvia-sms:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
    instances:
      celcoin-kyc:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
      celcoin-kyb:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
      celcoin-background-check:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
      celcoin-open-finance:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
      celcoin-pix:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        # Sprint 32 Task 32.5: follow-up fechado — PixProviderHttpException saiu da lista; o
        # predicate compartilhado (ProviderRetryConfig) reentra somente em 5xx traduzido
        # (ProviderHttpFault) e timeout/IO; 4xx e parsing nao reentram.
      celcoin-escrow:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        # Sprint 32 Task 32.5: mesmo predicate do celcoin-pix (4xx nao reentra).
      clicksign-assinatura:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        # Sprint 32 Task 32.4: follow-up fechado — AssinaturaProviderHttpException saiu da lista;
        # o predicate Java compartilhado (ProviderRetryConfig) reentra somente em 5xx traduzido
        # (ProviderHttpFault) e timeout/IO; 4xx e parsing nao reentram.
      zenvia-sms:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
    instances:
      celcoin-kyc:
        timeoutDuration: 30s
      celcoin-kyb:
        timeoutDuration: 30s
      celcoin-background-check:
        timeoutDuration: 30s
      celcoin-open-finance:
        timeoutDuration: 30s
      celcoin-pix:
        timeoutDuration: 30s
      celcoin-escrow:
        timeoutDuration: 30s
      clicksign-assinatura:
        timeoutDuration: 30s
      zenvia-sms:
        timeoutDuration: 30s

logging:
  level:
    root: INFO
    com.dynamis.sep_api: INFO
    org.hibernate.SQL: WARN
