spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sep_dev}
    username: ${DB_USER:sep}
    password: ${DB_PASSWORD:sep}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always # em dev, expor detalhes do healthcheck
  endpoints:
    web:
      exposure:
        include: "*" # em dev, expor todos para facilitar debug

app:
  # Sprint 13: WorkflowCobrancaSeeder e opt-in (matchIfMissing=false). Habilita aqui pra
  # popular workflow_cobranca automaticamente no dev local. Em CI, env var
  # APP_COBRANCA_WORKFLOW_SEED_HABILITADO=false sobrescreve quando profile=dev hita sep_test.
  cobranca:
    workflow-seed-habilitado: true

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.dynamis.sep_api: DEBUG
