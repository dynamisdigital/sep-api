plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'jacoco'
}

group = 'com.dynamis'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('mapstructVersion', '1.6.3')
	set('jjwtVersion', '0.12.6')
	set('springdocVersion', '2.8.13')
	set('javaUuidGeneratorVersion', '5.1.0')
	set('resilience4jVersion', '2.2.0')
	set('logstashEncoderVersion', '8.0')
	set('testcontainersVersion', '1.21.3')
	set('restAssuredVersion', '5.5.0')
	set('wiremockVersion', '3.9.2')
	set('wiremockSpringBootVersion', '3.1.0')
	set('thymeleafVersion', '3.1.3.RELEASE')
	set('pdfboxVersion', '3.0.3')
}

// Sprint 5 Task 5.2: googleauth 1.5.0 puxa httpclient 4.5.12 transitivamente.
// httpclient 4.x esta EOL desde 2022; 4.5.14 e o ultimo patch da serie 4 e fecha
// vulnerabilidades reportadas pelo Snyk em 4.5.13 e anteriores. Constraint forca
// a versao segura ate a migracao para uma lib TOTP sem dependencia transitiva
// de httpclient (avaliacao em ADR pos-Sprint 5).
dependencies {
	constraints {
		implementation 'org.apache.httpcomponents:httpclient:4.5.14'
	}
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	// Email SMTP para notificacoes transacionais (Sprint 13 - ADR 0014).
	// Habilita JavaMailSender no contexto; adapter consumidor entra em Task 13.3.
	// Thymeleaf standalone (declarado abaixo) sera reusado pra renderizar templates.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Persistencia (Postgres + Flyway)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT (preparado para Sprint 3)
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// Documentacao OpenAPI (configurada em detalhe na Sprint 4)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Mapeamento type-safe (substitui ModelMapper - ADR 0006)
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	// UUID v6 (PRD §11)
	implementation "com.fasterxml.uuid:java-uuid-generator:${javaUuidGeneratorVersion}"

	// Resilience4j (preparacao Celcoin via Provider Pattern - ADR 0004)
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"

	// MFA TOTP (Sprint 5 - ADR 0010)
	implementation 'com.warrenstrange:googleauth:1.5.0'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// Observabilidade (Micrometer + Prometheus)
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Logs estruturados com MDC (correlationId/traceId)
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

	// Thymeleaf standalone para renderizar templates de contrato (Sprint 10 Task 10.2).
	// Usamos a lib standalone (sem spring-boot-starter-thymeleaf) pra evitar plugar view
	// resolver em Spring MVC; o engine fica encapsulado no adapter do modulo `contratos`.
	// Versao pinada explicitamente — fix post-merge Sprint 10 — garante build reprodutivel
	// independente de alteracoes futuras no Spring Boot BOM.
	implementation "org.thymeleaf:thymeleaf:${thymeleafVersion}"

	// Apache PDFBox (Sprint 11 Task 11.3) - geracao da CCB em PDF estruturado.
	// PDF eh prova juridica (Lei 10.931/2004); precisa ser texto pesquisavel
	// (nao imagem) e gerado deterministicamente a partir do conteudo aprovado
	// na versao vigente do contrato. Versao 3.x (Apache 2.0) pinada para build
	// reprodutivel.
	implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"

	// Testes
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Testcontainers declarado mas SmokeBootTest da Sprint 1 usa Postgres local
	// (docker-compose) por incompatibilidade conhecida do docker-java embutido
	// em TC 1.21 com Docker Engine 28+. Sprint posterior reativa Testcontainers.
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"

	// WireMock para integration tests dos adapters HTTP do Celcoin (ADR 0008; uso real entra em Epic 5)
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
	testImplementation "org.wiremock.integrations:wiremock-spring-boot:${wiremockSpringBootVersion}"
}

// Compilation hints
compileJava {
	options.compilerArgs += [
		'-parameters',
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=ERROR'
	]
}

// ========================
// Spotless + Palantir Java Format
// (Sprint 0 Task 0.2)
// ========================
spotless {
	java {
		target 'src/**/*.java'
		targetExclude 'build/generated/**', 'build/generated-sources/**'

		palantirJavaFormat('2.50.0')
		removeUnusedImports()
		importOrder('', 'java|javax', '\\#')
		endWithNewline()
		trimTrailingWhitespace()
	}

	groovyGradle {
		target '*.gradle', 'gradle/**/*.gradle'
		greclipse()
		endWithNewline()
		trimTrailingWhitespace()
	}

	format 'misc', {
		target '*.md', '*.yml', '*.yaml', '*.json', '.gitignore', '.editorconfig'
		targetExclude 'build/**', '.gradle/**', 'node_modules/**'
		trimTrailingWhitespace()
		endWithNewline()
		indentWithSpaces(2)
	}

	// SQL formatter (dbeaver) intencionalmente desabilitado: gera output muito
	// agressivo (uppercase em palavras reservadas como `role`, quebras em
	// multiplas linhas para CREATE TABLE) que prejudica a legibilidade das
	// migrations Flyway. As migrations seguem padrao manual: 4 espacos de
	// indentacao, palavras reservadas em UPPER, identificadores em snake_case.
}

check.dependsOn 'spotlessCheck'

// ========================
// JaCoCo (Sprint 0 Task 0.3)
// Verificacao 70% DESATIVADA - ATIVAR na Sprint 4 (Task 4.3)
// ========================
jacoco {
	toolVersion = '0.8.12'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = false

		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/jacoco.xml')
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/SepApiApplication.class',
				'**/config/**',
				'**/dto/**',
				'**/*MapperImpl.class',
				'**/package-info.class',
				'**/exception/*Exception.class'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/SepApiApplication.class',
				'**/config/**',
				'**/dto/**',
				'**/*MapperImpl.class',
				'**/package-info.class',
				'**/exception/*Exception.class'
			])
		}))
	}

	violationRules {
		rule {
			enabled = true

			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

check.dependsOn 'jacocoTestCoverageVerification'
