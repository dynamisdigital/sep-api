plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'jacoco'
}

group = 'com.dynamis'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('mapstructVersion', '1.6.3')
	set('jjwtVersion', '0.12.6')
	set('springdocVersion', '2.8.13')
	set('javaUuidGeneratorVersion', '5.1.0')
	set('resilience4jVersion', '2.2.0')
	set('logstashEncoderVersion', '8.0')
	set('testcontainersVersion', '1.21.3')
	set('restAssuredVersion', '5.5.0')
	set('wiremockVersion', '3.9.2')
	set('wiremockSpringBootVersion', '3.1.0')
	set('thymeleafVersion', '3.1.5.RELEASE')
	set('pdfboxVersion', '3.0.3')

	// Overrides do BOM do Spring Boot (FMF-4.5). O Boot 3.5.16 resolve Tomcat
	// 10.1.55, Log4j 2.24.3 e pgjdbc 42.7.11, e as tres versoes estao dentro de
	// faixas de CVE com patch JA PUBLICADO — entao nao ha motivo para esperar o
	// proximo Boot. Sao propriedades que o proprio Boot expoe para isso; nao
	// substituem o BOM, so movem essas tres coordenadas.
	//
	// Remover assim que um Boot 3.5.x trouxer versoes iguais ou maiores: override
	// esquecido vira pin para tras quando o BOM ultrapassar o valor fixado aqui.
	set('tomcat.version', '10.1.60') // >= 10.1.59: CVE-2026-65637, CVE-2026-65905
	set('log4j2.version', '2.25.5') // >= 2.25.4: CVE-2026-53404
	set('postgresql.version', '42.7.13') // >= 42.7.12: CVE-2026-54291
}

// Sprint 5 Task 5.2: googleauth 1.5.0 puxa httpclient 4.5.12 transitivamente.
// httpclient 4.x esta EOL desde 2022; 4.5.14 e o ultimo patch da serie 4 e fecha
// vulnerabilidades reportadas pelo Snyk em 4.5.13 e anteriores. Constraint forca
// a versao segura ate a migracao para uma lib TOTP sem dependencia transitiva
// de httpclient (avaliacao em ADR pos-Sprint 5).
dependencies {
	constraints {
		implementation 'org.apache.httpcomponents:httpclient:4.5.14'
	}
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	// Email SMTP para notificacoes transacionais (Sprint 13 - ADR 0014).
	// Habilita JavaMailSender no contexto; adapter consumidor entra em Task 13.3.
	// Thymeleaf standalone (declarado abaixo) sera reusado pra renderizar templates.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Persistencia (Postgres + Flyway)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT (preparado para Sprint 3)
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// Documentacao OpenAPI (configurada em detalhe na Sprint 4)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Mapeamento type-safe (substitui ModelMapper - ADR 0006)
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	// UUID v6 (PRD §11)
	implementation "com.fasterxml.uuid:java-uuid-generator:${javaUuidGeneratorVersion}"

	// Resilience4j (preparacao Celcoin via Provider Pattern - ADR 0004)
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"

	// MFA TOTP (Sprint 5 - ADR 0010)
	implementation 'com.warrenstrange:googleauth:1.5.0'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	// Observabilidade (Micrometer + Prometheus)
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Logs estruturados com MDC (correlationId/traceId)
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

	// Thymeleaf standalone para renderizar templates de contrato (Sprint 10 Task 10.2).
	// Usamos a lib standalone (sem spring-boot-starter-thymeleaf) pra evitar plugar view
	// resolver em Spring MVC; o engine fica encapsulado no adapter do modulo `contratos`.
	// Versao pinada explicitamente — fix post-merge Sprint 10 — garante build reprodutivel
	// independente de alteracoes futuras no Spring Boot BOM.
	implementation "org.thymeleaf:thymeleaf:${thymeleafVersion}"

	// Apache PDFBox (Sprint 11 Task 11.3) - geracao da CCB em PDF estruturado.
	// PDF eh prova juridica (Lei 10.931/2004); precisa ser texto pesquisavel
	// (nao imagem) e gerado deterministicamente a partir do conteudo aprovado
	// na versao vigente do contrato. Versao 3.x (Apache 2.0) pinada para build
	// reprodutivel.
	implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"

	// Testes
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Testcontainers declarado mas SmokeBootTest da Sprint 1 usa Postgres local
	// (docker-compose) por incompatibilidade conhecida do docker-java embutido
	// em TC 1.21 com Docker Engine 28+. Sprint posterior reativa Testcontainers.
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"

	// WireMock para integration tests dos adapters HTTP do Celcoin (ADR 0008; uso real entra em Epic 5)
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
	testImplementation "org.wiremock.integrations:wiremock-spring-boot:${wiremockSpringBootVersion}"
}

// Compilation hints
compileJava {
	options.compilerArgs += [
		'-parameters',
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=ERROR'
	]
}

// ========================
// Spotless + Palantir Java Format
// (Sprint 0 Task 0.2)
// ========================
spotless {
	java {
		target 'src/**/*.java'
		targetExclude 'build/generated/**', 'build/generated-sources/**'

		palantirJavaFormat('2.50.0')
		removeUnusedImports()
		importOrder('', 'java|javax', '\\#')
		endWithNewline()
		trimTrailingWhitespace()
	}

	groovyGradle {
		target '*.gradle', 'gradle/**/*.gradle'
		greclipse()
		endWithNewline()
		trimTrailingWhitespace()
	}

	format 'misc', {
		target '*.md', '*.yml', '*.yaml', '*.json', '.gitignore', '.editorconfig'
		targetExclude 'build/**', '.gradle/**', 'node_modules/**'
		trimTrailingWhitespace()
		endWithNewline()
		indentWithSpaces(2)
	}

	// SQL formatter (dbeaver) intencionalmente desabilitado: gera output muito
	// agressivo (uppercase em palavras reservadas como `role`, quebras em
	// multiplas linhas para CREATE TABLE) que prejudica a legibilidade das
	// migrations Flyway. As migrations seguem padrao manual: 4 espacos de
	// indentacao, palavras reservadas em UPPER, identificadores em snake_case.
}

check.dependsOn 'spotlessCheck'

// ========================
// JaCoCo (Sprint 0 Task 0.3)
// Verificacao 70% DESATIVADA - ATIVAR na Sprint 4 (Task 4.3)
// ========================
jacoco {
	toolVersion = '0.8.12'
}

test {
	useJUnitPlatform()
	// Sprint 14 follow-up: heap default (~512MB) estoura em CI com 1421 testes e
	// varios @SpringBootTest mantendo contexts no cache. PldFollowupIT triggava
	// OutOfMemoryError em Streams.java:870. 2g cobre o pool atual com margem.
	maxHeapSize = '2g'
	// Limita o cache de contexts pra evitar acumulo (default = 32). Reduz pressao
	// de heap quando configuracoes de @SpringBootTest variam entre suites.
	systemProperty 'spring.test.context.cache.maxSize', '8'
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = false

		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/jacoco.xml')
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/SepApiApplication.class',
				'**/config/**',
				'**/dto/**',
				'**/*MapperImpl.class',
				'**/package-info.class',
				'**/exception/*Exception.class'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/SepApiApplication.class',
				'**/config/**',
				'**/dto/**',
				'**/*MapperImpl.class',
				'**/package-info.class',
				'**/exception/*Exception.class'
			])
		}))
	}

	violationRules {
		rule {
			enabled = true

			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

check.dependsOn 'jacocoTestCoverageVerification'

// ========================
// OWASP Dependency-Check (FMF-4.5 / pre-condicao P8 do PLANO-INFRA-AWS)
//
// Fecha a ultima lacuna de scan de dependencia dos tres repos: `sep-app` e
// `sep-mobile` ja tinham `npm audit --audit-level=high` no CI desde a
// D-Sprint 1; o `sep-api` nao tinha nada.
//
// `failBuildOnCVSS = 7.0` e a MESMA semantica do `--audit-level=high` dos dois
// fronts: CVSS v3 >= 7.0 e a faixa HIGH. Um so criterio nos tres repos.
//
// DELIBERADAMENTE FORA DE `check`: o gate e task propria, chamada por step
// proprio no CI, espelhando o `npm audit` dos fronts (que tambem nao roda
// dentro de `npm test`). Motivos: (1) `dependencyCheckAnalyze` precisa de rede
// e da base do NVD, e `./gradlew check` tem de continuar rodando offline e em
// segundos; (2) achado de dependencia nao e regressao de codigo, e misturar os
// dois faz um CVE novo reprovar o build de quem nao mexeu em dependencia.
// ========================
dependencyCheck {
	// CVSS v3 >= 7.0 == HIGH. Mesmo limiar do `--audit-level=high` dos fronts.
	failBuildOnCVSS = 7.0f

	// Chave lida do ambiente (secret `NVD_API_KEY`) para nunca versionar segredo.
	//
	// SEM CHAVE O COMPORTAMENTO DEPENDE DO IP, e isso custou um CI vermelho:
	//  - maquina de desenvolvimento, IP proprio: a carga anonima COMPLETA, em
	//    ~1h30m (~1 requisicao a cada 6s);
	//  - runner do GitHub, IP compartilhado: o NVD devolve **429** e o scan
	//    ABORTA — `NvdApiException: NVD Returned Status Code: 429` apos ~13 min
	//    e 31 retentativas.
	// Medicao feita fora do ambiente de execucao nao vale como previsao. Por isso
	// o `ci.yml` checa o secret e pula o scan quando ele falta, em vez de gastar
	// 13 min para falhar por infraestrutura.
	//
	// Com chave, a carga cai para minutos; depois dela o que roda e atualizacao
	// incremental, cacheada no CI.
	//
	// POR QUE A SERIE 12 E NAO A 13 — medido, nao presumido (FMF-4.5):
	// na 13.0.0 o scan ABORTA sem chave, com
	//   `NvdApiException: Invalid API Key, length of 0 too short to provided a
	//    masked partial key`
	// e a guarda `if` abaixo NAO evita isso: o default do plugin e string vazia,
	// nao nulo, e o cliente do NVD rejeita a vazia antes de considerar o modo
	// anonimo. Na 12.2.2 o mesmo cenario avisa
	//   `An NVD API Key was not provided - it is highly recommended ...`
	// e SEGUE. A diferenca importa para quem roda LOCAL sem chave: na 12.2.2 o
	// scan funciona, na 13 nao ha como rodar. No CI a guarda do `ci.yml` ja pula
	// o job quando o secret falta — inclusive em PR de fork, que em repositorio
	// publico nunca recebe secret —, entao ali a versao do plugin nao muda o
	// desfecho. Subir para a 13 exige aceitar que ninguem escaneia sem chave.
	//
	// A guarda `if` fica de todo modo: sem ela, `apiKey = null` tambem quebra.
	nvd {
		def nvdApiKey = System.getenv('NVD_API_KEY')
		if (nvdApiKey) {
			apiKey = nvdApiKey
		}
	}

	// Cada supressao precisa de evidencia escrita no proprio arquivo.
	suppressionFile = 'config/dependency-check-suppressions.xml'

	// HTML para leitura humana, JSON para consumo por ferramenta.
	formats = ['HTML', 'JSON']

	// ESCOPO: so o que vai para producao. O plugin pula configuracoes de teste
	// por default; a linha esta escrita para ser DECISAO e nao acidente.
	// Medido: sem ela o scan cobre 162 artefatos e NENHUM de teste — junit,
	// mockito, wiremock, rest-assured e testcontainers ficam de fora.
	//
	// Diferenca consciente para os fronts: o `npm audit --audit-level=high`
	// deles gateia a arvore inteira, incluindo devDependencies. Aqui um CVE no
	// WireMock nao alcanca o produto, e gatear por ele so ensinaria o time a
	// ignorar o job. O recorte de runtime dos fronts (`--omit=dev`) e o que
	// corresponde a este escopo, e nos dois esta em zero.
	skipTestGroups = true

	analyzers {
		// Analisadores de ecossistemas que este repo nao tem. Desligados para
		// cortar tempo de analise e falso positivo, nao para esconder achado.
		assemblyEnabled = false
		nodeAuditEnabled = false
		nodeEnabled = false
		nuspecEnabled = false
		nugetconfEnabled = false
		retirejs { enabled = false }
	}
}

// O Gradle da `dependencyCheckAnalyze` como UP-TO-DATE quando as dependencias
// nao mudam — e foi exatamente isso que produziu um verde falso ao provar este
// gate por mutacao: a dependencia vulneravel entrou no `runtimeClasspath`, a
// task nao rodou, e o build passou.
//
// Em CI o efeito e pior que num ensaio: as entradas da task sao as dependencias
// do projeto, mas a fonte de verdade e a base do NVD, que muda TODO DIA. Sem
// esta linha, um CVE publicado hoje contra uma dependencia que ninguem tocou
// nunca reprovaria o build — o gate existiria e nao mediria nada.
dependencyCheckAnalyze {
	outputs.upToDateWhen { false }
}
