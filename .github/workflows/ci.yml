name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Roda em push de qualquer branch (feature/*, fix/*, hotfix/*, etc.) pra
    # garantir test+build antes de abrir PR. PRs ainda recebem run via
    # pull_request — branches com PR aberto rodarao 2 vezes; tolerado por
    # decisao da equipe (commit 6fb99ac restaurado apos PR #29).
    branches: ['**']
  workflow_dispatch:

# Cancela runs antigos do mesmo PR/branch quando novos chegam
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, Spotless, JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: sep
          POSTGRES_DB: sep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Sprint 14 follow-up: testes com @ActiveProfiles("dev") leem application-dev.yml
      # que aponta pra banco `sep_dev`. O service postgres acima cria apenas `sep_test`
      # via POSTGRES_DB, entao precisamos criar `sep_dev` manualmente pra evitar
      # `FATAL: database "sep_dev" does not exist` no Flyway init. Testes profile=test
      # continuam usando `sep_test`; profile=dev usam `sep_dev` (isolamento entre profiles
      # mantido).
      - name: Create sep_dev database
        run: PGPASSWORD=sep psql -h localhost -U sep -d postgres -c "CREATE DATABASE sep_dev OWNER sep;"

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test and JaCoCo verification
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon
        # Sprint 14 follow-up: removido override SPRING_DATASOURCE_URL=sep_test
        # (evidencia em CI mostrou que env vars do step nao chegavam ao Spring Boot
        # test fork JVM via relaxed binding — Flyway tentava abrir sep_dev mesmo
        # assim). Agora profile=dev usa sep_dev, profile=test usa sep_test, ambos
        # bancos provisionados (sep_test pelo POSTGRES_DB, sep_dev pelo step acima).
        # Defaults sep/sep do application*.yml batem com POSTGRES_USER/POSTGRES_PASSWORD.

      - name: JaCoCo report
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 14

  scan:
    name: Dependency Scan
    runs-on: ubuntu-24.04
    # Job PROPRIO, nao step do `test` (FMF-4.5 / pre-condicao P8):
    #  - o `test` tem timeout de 15 min e a carga inicial do NVD estoura isso;
    #  - achado de dependencia nao e regressao de codigo, e misturar os dois faz
    #    um CVE publicado hoje reprovar o build de quem nao mexeu em dependencia;
    #  - rodando em paralelo com o `test`, nao atrasa o feedback da suite.
    # Espelha o `npm audit` dos dois fronts, que tambem e step proprio e nao
    # roda dentro de `npm test`.
    #
    # O secret `NVD_API_KEY` e REQUISITO, nao otimizacao de tempo — medido no
    # proprio runner: sem chave o NVD devolve `429` e o
    # `dependencyCheckAnalyze` ABORTA com
    #   NvdApiException: NVD Returned Status Code: 429
    # depois de ~13 min e 31 retentativas. Runner do GitHub sai por IP
    # compartilhado, e o limite anonimo do NVD e por IP.
    #
    # CORRECAO DE UMA MEDICAO ANTERIOR: a primeira versao deste comentario dizia
    # "1h30m sem chave". Esse numero veio de uma maquina de desenvolvimento com
    # IP proprio, onde a carga anonima de fato completa. **Nao transfere para o
    # runner.** Medicao em ambiente diferente do de execucao nao vale como
    # previsao.
    #
    # Por isso o primeiro step checa o secret e PULA o scan quando ele falta, em
    # vez de gastar 13 min para falhar por infraestrutura. Quando o secret for
    # adicionado, o scan volta a rodar sozinho, sem editar este arquivo.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # O `secrets` nao esta disponivel em `if` de JOB, so de STEP — por isso a
      # checagem virou step com output, em vez de uma condicao no job.
      #
      # Em repositorio publico (que estes tres sao) PR vindo de fork NUNCA recebe
      # secret, entao este caminho tambem e o de fork, nao so o de secret
      # ausente.
      - name: Verificar NVD_API_KEY
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=Dependency scan PULADO::O secret NVD_API_KEY nao esta configurado, e sem ele o NVD devolve 429 para o runner (IP compartilhado). O scan NAO rodou e nenhuma vulnerabilidade foi verificada neste run. Configure em Settings > Secrets and variables > Actions. Follow-up (b45)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # A base do NVD e mutavel (atualiza todo dia), entao a chave exata nunca
      # bate e o cache SEMPRE grava; o `restore-keys` recupera a entrada mais
      # recente. Sem isso, cada run refaz a carga inicial inteira.
      - name: Cache NVD database
        if: steps.nvd.outputs.ok == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # `failBuildOnCVSS = 7.0` no build.gradle == `--audit-level=high` dos
      # fronts.
      - name: Dependency scan
        if: steps.nvd.outputs.ok == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload dependency-check report
        if: always() && steps.nvd.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          retention-days: 14

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build package
        run: ./gradlew bootJar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sep-api-jar
          path: build/libs/*.jar
          retention-days: 14
