name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Roda em push de qualquer branch (feature/*, fix/*, hotfix/*, etc.) pra
    # garantir test+build antes de abrir PR. PRs ainda recebem run via
    # pull_request — branches com PR aberto rodarao 2 vezes; tolerado por
    # decisao da equipe (commit 6fb99ac restaurado apos PR #29).
    branches: ['**']
  workflow_dispatch:

# Cancela runs antigos do mesmo PR/branch quando novos chegam
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, Spotless, JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: sep
          POSTGRES_DB: sep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Sprint 14 follow-up: testes com @ActiveProfiles("dev") leem application-dev.yml
      # que aponta pra banco `sep_dev`. O service postgres acima cria apenas `sep_test`
      # via POSTGRES_DB, entao precisamos criar `sep_dev` manualmente pra evitar
      # `FATAL: database "sep_dev" does not exist` no Flyway init. Testes profile=test
      # continuam usando `sep_test`; profile=dev usam `sep_dev` (isolamento entre profiles
      # mantido).
      - name: Create sep_dev database
        run: PGPASSWORD=sep psql -h localhost -U sep -d postgres -c "CREATE DATABASE sep_dev OWNER sep;"

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test and JaCoCo verification
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon
        # Sprint 14 follow-up: removido override SPRING_DATASOURCE_URL=sep_test
        # (evidencia em CI mostrou que env vars do step nao chegavam ao Spring Boot
        # test fork JVM via relaxed binding — Flyway tentava abrir sep_dev mesmo
        # assim). Agora profile=dev usa sep_dev, profile=test usa sep_test, ambos
        # bancos provisionados (sep_test pelo POSTGRES_DB, sep_dev pelo step acima).
        # Defaults sep/sep do application*.yml batem com POSTGRES_USER/POSTGRES_PASSWORD.

      - name: JaCoCo report
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 14

  scan:
    name: Dependency Scan
    runs-on: ubuntu-24.04
    # Job PROPRIO, nao step do `test` (FMF-4.5 / pre-condicao P8):
    #  - o `test` tem timeout de 15 min e a carga inicial do NVD estoura isso;
    #  - achado de dependencia nao e regressao de codigo, e misturar os dois faz
    #    um CVE publicado hoje reprovar o build de quem nao mexeu em dependencia;
    #  - rodando em paralelo com o `test`, nao atrasa o feedback da suite.
    # Espelha o `npm audit` dos dois fronts, que tambem e step proprio e nao
    # roda dentro de `npm test`.
    #
    # 20 min pressupoe o secret `NVD_API_KEY` configurado: medido nesta maquina,
    # a carga fria da base do NVD leva 1h30m SEM chave e minutos COM chave.
    # Se o secret for removido, este job passa a estourar o timeout — o que e o
    # comportamento desejado (falha visivel), nao um defeito a contornar
    # subindo o numero.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # A base do NVD e mutavel (atualiza todo dia), entao a chave exata nunca
      # bate e o cache SEMPRE grava; o `restore-keys` recupera a entrada mais
      # recente. Sem isso, cada run refaz a carga inicial inteira.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # `failBuildOnCVSS = 7.0` no build.gradle == `--audit-level=high` dos
      # fronts. O secret NVD_API_KEY e OPCIONAL: sem ele o NVD limita a ~1
      # requisicao a cada 6s e a carga inicial leva dezenas de minutos, mas o
      # scan roda. Em repositorio publico, PR vindo de fork nunca recebe secret
      # — e por isso que a versao do plugin tem de tolerar a ausencia da chave.
      - name: Dependency scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          retention-days: 14

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build package
        run: ./gradlew bootJar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sep-api-jar
          path: build/libs/*.jar
          retention-days: 14
