name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Roda em push de qualquer branch (feature/*, fix/*, hotfix/*, etc.) pra
    # garantir test+build antes de abrir PR. PRs ainda recebem run via
    # pull_request — branches com PR aberto rodarao 2 vezes; tolerado por
    # decisao da equipe (commit 6fb99ac restaurado apos PR #29).
    branches: ['**']
  workflow_dispatch:

# Cancela runs antigos do mesmo PR/branch quando novos chegam
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, Spotless, JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: sep
          POSTGRES_DB: sep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test and JaCoCo verification
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sep_test
          SPRING_DATASOURCE_USERNAME: sep
          SPRING_DATASOURCE_PASSWORD: sep
          # Sprint 13: profile=dev tests em CI hitam sep_test (URL override acima).
          # Desabilita WorkflowCobrancaSeeder pra nao poluir sep_test e colidir
          # com UNIQUE parcial de WorkflowCobrancaRepositoryTest.
          APP_COBRANCA_WORKFLOW_SEED_HABILITADO: 'false'

      - name: JaCoCo report
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 14

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build package
        run: ./gradlew bootJar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sep-api-jar
          path: build/libs/*.jar
          retention-days: 14
